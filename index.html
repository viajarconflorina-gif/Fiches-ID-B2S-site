<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiches ID B2S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* VOICE: outil de travail d'une équipe événementielle, net et chaleureux.
   IDEA: chaque fiche est un pass / billet d'événement, avec sa souche perforée.
   PICTURE: le billet en tête de fiche, avec l'avancement par pôle et les alertes.
   COLOUR: une couleur douce par pôle (bleus, verts, rose poudré), cases à remplir jaune pâle.
   TYPE: DM Sans. LAYOUT: liste des fiches puis fiche à onglets, une colonne calme. */
:root{color-scheme:light;
 --bg:light-dark(#F3F5F8,#0E151C);--card:light-dark(#FFFFFF,#16202A);--ink:light-dark(#18222E,#E6ECF2);
 --mute:light-dark(#5B6878,#97A6B5);--line:light-dark(#DCE2E9,#263342);--in:light-dark(#FFF7D6,#2A2717);
 --in-b:light-dark(#EADFAE,#4A4426);--auto:light-dark(#EEF1F5,#1C2733);--acc:#1E3A5F;
 --ok:light-dark(#DCFCE7,#12351F);--okt:light-dark(#166534,#86EFAC);--mid:light-dark(#FEF3C7,#3A2E0C);--midt:light-dark(#92400E,#FCD34D);
 --bad:light-dark(#FEE2E2,#3B1515);--badt:light-dark(#991B1B,#FCA5A5);--na:light-dark(#F1F3F5,#1B232C);--nat:light-dark(#6B7280,#8A97A5)}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px max(4vw,14px) 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--badt)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.chip:focus-visible{outline:3px solid #7FA7D6;outline-offset:2px}
.banner{padding:12px 14px;border-radius:10px;background:var(--mid);color:var(--midt);margin-bottom:14px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;text-align:left;display:grid;gap:8px;position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--acc)}
.ev h3{margin:0;font-size:19px;line-height:1.2}
.ev .meta{color:var(--mute);font-size:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute)}
/* billet */
.ticket{display:grid;grid-template-columns:minmax(0,1fr) 220px;background:var(--acc);color:#fff;border-radius:18px;position:relative;margin-bottom:16px}
.ticket .main{padding:22px 24px}
.ticket .stub{padding:20px;border-left:2px dashed rgba(255,255,255,.35);display:grid;align-content:center;justify-items:center;gap:6px;text-align:center}
.ticket::before,.ticket::after{content:"";position:absolute;right:209px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket h2{font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.big{font-size:44px;font-weight:700;line-height:1}
.status{background:#fff;color:var(--acc);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.bars{display:grid;gap:5px;margin-top:14px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.bar i{display:block;height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar b{display:block;height:100%;border-radius:9px;background:#fff}
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.alert{background:var(--bad);color:var(--badt);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.alert.okk{background:var(--ok);color:var(--okt)}
.bar-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.saved{color:var(--mute);font-size:13px;margin-left:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.tab{flex:none;border:0;border-radius:10px 10px 0 0;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--card);color:var(--mute);font-weight:600;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--tc)}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.block>h3{margin:0;padding:12px 16px;font-size:16px;background:var(--tc);color:#fff;display:flex;gap:10px;align-items:center}
.block>h3 small{font-weight:400;opacity:.85;font-size:13px}
.bnote{padding:8px 16px 0;color:var(--mute);font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px 18px;padding:14px 16px}
.fld{display:grid;gap:4px}
.fld label{font-size:13px;font-weight:600;color:var(--mute)}
.fld.wide{grid-column:1/-1}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--in-b);border-radius:8px;padding:9px 10px;min-height:44px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.auto{background:var(--auto);border-radius:8px;padding:10px;min-height:44px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ok);color:var(--okt);border-color:transparent;font-weight:700}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{min-height:38px;padding:6px 8px;font-size:15px}
td.calc{background:var(--auto);font-weight:600;white-space:nowrap;border-radius:6px}
td.rm{width:40px}
.x{border:0;background:transparent;color:var(--mute);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px}
.addrow{margin:10px 16px 14px}
.c-ok{background:var(--ok)!important;color:var(--okt)!important;font-weight:700}
.c-mid{background:var(--mid)!important;color:var(--midt)!important;font-weight:700}
.c-bad{background:var(--bad)!important;color:var(--badt)!important;font-weight:700}
.c-na{background:var(--na)!important;color:var(--nat)!important}
.n1{background:#DC2626!important;color:#fff!important}.n2{background:#F97316!important;color:#fff!important}
.n3{background:#FACC15!important;color:#000!important}.n4{background:#4ADE80!important;color:#000!important}.n5{background:#15803D!important;color:#fff!important}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;font-size:12px}
.legend span{padding:3px 9px;border-radius:999px;font-weight:700}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px;padding:14px 16px}
.mod{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:48px;cursor:pointer;background:var(--card);text-align:left}
.mod b{font-size:12px;padding:3px 10px;border-radius:999px}
.mod[aria-pressed=true] b{background:var(--ok);color:var(--okt)}
.mod[aria-pressed=false] b{background:var(--na);color:var(--nat)}
.plist{padding:10px 16px 14px;display:grid;gap:6px}
.plist div{display:flex;justify-content:space-between;gap:10px;background:var(--auto);border-radius:8px;padding:8px 12px}
.confirm{display:inline-flex;gap:8px;align-items:center}
.folder{padding-top:22px;background:var(--card)}
.folder::before{background:#E0B84F}
.tabcut{position:absolute;top:0;left:22px;width:90px;height:10px;background:#E0B84F;border-radius:0 0 8px 8px}
.kicker{font-size:13px;letter-spacing:.02em;opacity:.8;margin-bottom:4px}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px}
.mrow>input:not([type=checkbox]):not([type=color]){flex:1 1 200px}
.mrow>select{flex:0 1 170px;width:auto}
.mrow .wide-in{flex:2 1 260px}
.mchk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mute);min-height:44px}
.mtools{display:flex;gap:2px;margin-left:auto}
.mlist{padding:4px 0 12px}
.mlist>.mrow{padding:4px 16px;border-top:1px solid var(--line)}
.mlist>textarea{margin:0 16px;width:calc(100% - 32px)}
.mhead{padding:8px 16px 4px;font-size:13px;font-weight:700;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:default}
.small{font-size:13px;color:var(--mute)}
@media(max-width:700px){.ticket{grid-template-columns:1fr}.ticket .stub{border-left:0;border-top:2px dashed rgba(255,255,255,.35)}.ticket::before,.ticket::after{display:none}.bar{grid-template-columns:96px minmax(0,1fr) 40px}}
@media(max-width:700px){
 .wrap{padding:14px 12px 48px}
 .top h1{font-size:20px;flex-basis:100%}
 .top .btn,.bar-actions .btn{flex:1 1 auto;padding:9px 10px;font-size:15px}
 .bar-actions .saved{flex-basis:100%;margin-left:0}
 .bar-actions label{flex-basis:100%}
 .bar-actions select{flex:1}
 .ticket .main{padding:18px 16px}
 .ticket .stub{grid-auto-flow:column;justify-content:space-between;align-items:center;padding:12px 16px}
 .big{font-size:32px}
 .block>h3{font-size:15px;padding:11px 14px}
 .fields{padding:12px 14px}
 .tw{overflow:visible}
 table.stack,table.stack tbody{display:block;width:100%}
 table.stack thead{display:none}
 table.stack tr{display:grid;gap:6px;margin:10px 12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card);position:relative}
 table.stack td{display:grid;grid-template-columns:7.5em minmax(0,1fr);align-items:center;gap:8px;border:0;padding:0}
 table.stack td::before{content:attr(data-l);font-size:12px;font-weight:700;color:var(--mute)}
 table.stack td.calc{background:transparent;padding:0}
 table.stack td.calc:not(:empty){font-weight:700}
 table.stack td.rm{position:absolute;top:4px;right:4px;display:block}
 table.stack td.rm::before{content:none}
 table.stack tr:has(td.rm) td:first-child{padding-right:34px}
 .addrow{margin:4px 12px 14px;width:calc(100% - 24px)}
 .mrow>select,.mrow>input{flex:1 1 100%}
 .mtools{margin-left:0}
 .alerts .alert{font-size:13px}
 .cards{gap:10px}
}
@media(prefers-reduced-motion:no-preference){.ev{transition:transform .15s}.ev:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap" id="app">
 <div class="top"><h1>Fiches ID</h1></div>
 <p class="small">Chargement…</p>
</div>

<script>
{

const PLATS=["Bizouk","Billetweb","Shotgun","Weezevent","Dice","Autre"];
const R=a=>a.map(x=>typeof x==="string"?{_:x}:x);
const DEFAULT_SCHEMA=[
{id:"identite",t:"Identité",c:"#1E3A5F",blocks:[
 {id:"carte",t:"Carte d'identité",fields:[["nom","Nom du concept"],["date","Date","date"],["hdeb","Heure de début","time"],["hfin","Heure de fin","time"],["cap","Capacité max","number"],["age","Public : âge","select",["18 ans et +","18-25","25-35","35-45","Tous âges"]],["profil","Public : profil","area"],["porteur","Porteur du projet"],["force","Forcer le statut","select",["Annulé","En pause","Terminé"]]]},

 {id:"concept_team",mod:"concept",t:"Équipe concept",table:{cols:[["role","Rôle"],["nom","Nom"],["statut","Statut","select",TEAM],["tel","Téléphone"]],rows:[{role:"Concept manager"}]}},
 {id:"retro",t:"Rétroplanning",note:"La deadline se calcule avec la date de l'événement et le « J- ».",table:{cols:[["phase","Phase","select",["Conception","Préparation","Lancement","Dernière ligne droite","Jour J","Après"]],["etape","Étape"],["resp","Responsable"],["j","J-","number"],["dl","Deadline","calc"],["statut","Statut","select",["À faire","En cours","Terminé","Bloqué"]]],rows:[

  ["Lancement","Lancement de la com",45],["Lancement","Ouverture de la billetterie",45],["Lancement","Annonce du line-up",35],["Lancement","Partenaires signés",30],
  ["Dernière ligne droite","Autorisations obtenues",21],["Dernière ligne droite","Staff complet",14],["Dernière ligne droite","Brief staff",3],["Dernière ligne droite","Point final logistique",2],

 {id:"admin",mod:"admin",t:"Administratif & légal",table:{cols:[["doc","Document / démarche"],["conc","Concerné ?","select",["Oui","N/A"]],["qui","Qui s'en occupe"],["dl","Deadline","date"],["statut","Statut","select",["À faire","En cours","Fait"]]],rows:["Contrat du lieu","Contrats artistes","Contrats DJ","Contrats / déclarations du staff","Licence alcool","Autorisations (mairie ou autre)"].map(x=>({doc:x}))}}]},
{id:"prog",t:"Prog",c:"#2E7D6B",blocks:[
 {id:"lieu",t:"Lieu",fields:[["lstat","Statut du lieu","select",["Trouvé","En négociation","À rechercher"]],
  ["lnom","Nom du lieu",0,0,"found"],["ladr","Adresse",0,0,"found"],["lville","Ville",0,0,"found"],["ltype","Type de lieu","select",LIEU,"found"],["lcap","Capacité officielle","number",0,"found"],["lfin","Heure de fin autorisée","time",0,"found"],["lcontact","Contact du lieu",0,0,"found"],["lpart","Particularités","area",0,"found"],
  ["rzone","Zone recherchée","select",["Paris","Petite couronne (92-93-94)","Grande couronne (77-78-91-95)","Province","Antilles / Outre-mer","Autre"],"search"],["rprec","Précision (ex : 30 min de Paris, proche RER)",0,0,"search"],["rtype","Type de lieu recherché","select",LIEU,"search"],["rbud","Budget location max (€)","number",0,"search"],["rfin","Heure de fin souhaitée","time",0,"search"],["rdl","Date limite pour trouver","date",0,"search"]]},
 {id:"equip",t:"Équipements",note:"OK lieu = le lieu l'a · À prévoir = on s'en occupe.",table:{cols:[["eq","Équipement"],["st","Statut","select",EQ]],rows:["Son","Lumière","Scène / DJ booth","Bar","Licence alcool","Vestiaire","Cuisine / espace food","Espace extérieur","Parking","Loges artistes","Accès PMR","Sécurité"].map(x=>({eq:x}))}},
 {id:"art",t:"Artistique",fields:[["style","Style principal","select",["Afro-caribéen","Bouyon","Shatta","Dancehall","Afro","Kompa","Zouk","Rap","Open format","Autre"]],["noto","Notoriété visée","select",["Local","Émergent","Confirmé","Tête d'affiche","Mix"]],["bart","Budget artistique max (€)","number"]]},
 {id:"lineup",t:"Line-up",table:{cols:[["nom","Nom"],["type","Type","select",["DJ","Artiste","MC","Danseuse / danseur","Performeur","Animation"]],["deb","Début","time"],["fin","Fin","time"],["statut","Statut","select",["Contacté","Négociation","Confirmé","Contrat signé","Annulé"]],["note","Note"]],rows:[]}},

 {id:"canaux",t:"Marketing & communication",table:{cols:[["canal","Canal"],["util","Utilisé ?","select",YN],["rythme","Rythme","select",["Quotidien","2-3 fois / semaine","Hebdomadaire","Ponctuel"]],["statut","Statut","select",["À préparer","Prêt","En ligne"]]],rows:["Instagram","TikTok","Snapchat","Facebook","WhatsApp (groupes, statuts)","Publicité payante (ads)","Affichage / flyers","Radio / médias","Emailing / SMS"].map(x=>({canal:x}))}},
 {id:"infl",mod:"infl",t:"Influenceurs / créateurs",table:{cols:[["nom","Nom / compte"],["reseau","Réseau","select",["Instagram","TikTok","Snapchat","YouTube","Autre"]],["abo","Abonnés","number"],["deal","Deal","select",["Invitation","Rémunéré","Échange"]],["statut","Statut","select",["À contacter","Contacté","Confirmé","Refusé"]]],rows:[]}}]},
{id:"commercial",t:"Commercial & RP",c:"#4E8A5C",mod:"comm",blocks:[
 {id:"besoinsp",t:"Nos besoins à faire couvrir par un partenaire",special:"besoinsp"},
 {id:"demarchage",t:"Partenaires & sponsors",table:{cols:[["marque","Marque"],["secteur","Secteur","select",["Boisson","Alcool","Food","Mode","Beauté","Média","Tech / télécom","Commerce local","Autre"]],["apport","Type d'apport","select",["Cash","Nature","Visibilité","Mixte"]],["demande","Ce qu'on demande"],["valeur","Valeur (€)","number"],["contre","Contrepartie"],["contact","Contact"],["statut","Statut","select",["À contacter","Contacté","Relancé","RDV","Signé","Refusé"]],["dernier","Dernier contact","date"]],rows:[]}},
 {id:"vip",mod:"vip",t:"VIP, ambassadeurs, presse",table:{cols:[["nom","Nom"],["role","Rôle","select",["VIP","Ambassadeur·rice","Média / presse","Influenceur·se","Invité partenaire"]],["inv","Invitations","number"],["statut","Statut","select",["À contacter","Invité","Confirmé","Refusé"]]],rows:[]}}]},
{id:"ope",t:"Opérationnel",c:"#3A7CA5",blocks:[

    while (used.has(n)) n = name + " " + i++; used.add(n);

      pageSetup: {orientation: "landscape", fitToPage: true, fitToWidth: 1, fitToHeight: 0}});

  const emit = () => { const m = load(); for (const s_ of subs) {
    if (s_.doc) { const d = m[s_.path]; s_.n({exists: !!d, data: () => d, metadata: {fromCache: false}}); }
    else { const docs = Object.keys(m).filter(p => p.startsWith(s_.path + "/") && p.split("/").length === 2).map(p => ({id: p.split("/")[1], exists: true, data: () => m[p]})); s_.n({docs, metadata: {fromCache: false}}); } } };
  const localDb = {
    collection: p => ({onSnapshot: n => { subs.push({path: p, n}); setTimeout(emit, 0); return () => {}; }}),
    doc: p => ({onSnapshot: n => { subs.push({path: p, n, doc: 1}); setTimeout(emit, 0); return () => {}; },
      set: async d => { load()[p] = clone(d); save(); setTimeout(emit, 0); }, delete: async () => { delete load()[p]; save(); setTimeout(emit, 0); }})};
  const localDl = {save: async ({filename, data}) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data])); a.download = filename; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return {status: "saved"}; }};
  window.claude = {use: async n => n === "db" ? localDb : n === "downloads" ? localDl : n === "user" ? {can: async () => true, canEdit: async () => true} : null};
  window.backup = () => localDl.save({filename: "Sauvegarde fiches ID " + isoD(new Date()) + ".json", data: JSON.stringify(load(), null, 1)});
  window.restore = async file => {
    if (!file) return;
    try { const d = JSON.parse(await file.text()); if (!d || typeof d !== "object") throw 0; mem = d; save(); emit(); note("Sauvegarde importée."); }
    catch (e) { note("Ce fichier n'est pas une sauvegarde de fiches ID."); }
  };
}
var backup = window.backup || (() => {}), restore = window.restore || (() => {});
window.addEventListener("hashchange", route);
route();
connect();

}
